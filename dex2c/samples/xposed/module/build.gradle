plugins { id 'com.android.application'; id 'io.github.xihan123.dex2c' }
android {
    namespace='io.github.xihan123.dex2c.sample.module'
    compileSdk=37
    ndkVersion='30.0.16248370'
    defaultConfig { applicationId='io.github.xihan123.dex2c.sample.module'; minSdk=26; targetSdk=37; versionCode=1; versionName='0.1'; ndk { abiFilters 'arm64-v8a' } }
    compileOptions { sourceCompatibility=JavaVersion.VERSION_21; targetCompatibility=JavaVersion.VERSION_21 }
    buildTypes {
        release {
            minifyEnabled=true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig=signingConfigs.debug
        }
    }
    packaging { jniLibs { useLegacyPackaging=false } }
    externalNativeBuild { cmake { path=file('src/main/cpp/CMakeLists.txt'); version='4.1.2' } }
}
dependencies { implementation project(':shared'); compileOnly 'io.github.libxposed:api:102.0.0' }
if (providers.gradleProperty('dex2c.clang').isPresent()) {
    dex2c { clangExecutable=file(providers.gradleProperty('dex2c.clang').get()) }
}
if (providers.gradleProperty('dex2c.certificate').isPresent()) {
    dex2c { certificateFile=file(providers.gradleProperty('dex2c.certificate').get()) }
}
