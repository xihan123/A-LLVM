plugins { id 'com.android.application'; id 'io.github.xihan123.dex2c' }

def cseScopedEnabled = providers.gradleProperty('coreHardening.cseScoped')
        .map { it.toBoolean() }.getOrElse(false)

android {
    namespace='io.github.xihan123.corehardening.sample.module'
    compileSdk=37
    ndkVersion='30.0.16248370'
    buildFeatures { buildConfig=true }
    defaultConfig {
        applicationId='io.github.xihan123.corehardening.sample.module'
        minSdk=26
        targetSdk=37
        versionCode=1
        versionName='0.1'
        buildConfigField 'boolean', 'CSE_SCOPED', cseScopedEnabled.toString()
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                arguments "-DCORE_CSE_SCOPED=${cseScopedEnabled ? 'ON' : 'OFF'}"
                if (providers.gradleProperty('dex2c.clang').isPresent()) {
                    arguments "-DCORE_FUSION_CLANG=${providers.gradleProperty('dex2c.clang').get()}"
                }
                if (providers.gradleProperty('dex2c.certificate').isPresent()) {
                    arguments "-DCORE_CSE_CERTIFICATE=${providers.gradleProperty('dex2c.certificate').get()}"
                }
                if (providers.gradleProperty('dex2c.pythonExecutable').isPresent()) {
                    arguments "-DCORE_CSE_PYTHON=${providers.gradleProperty('dex2c.pythonExecutable').get()}"
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility=JavaVersion.VERSION_21
        targetCompatibility=JavaVersion.VERSION_21
    }
    buildTypes {
        release {
            minifyEnabled=true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig=signingConfigs.debug
        }
    }
    packaging { jniLibs { useLegacyPackaging=false } }
    externalNativeBuild {
        cmake {
            path=file('src/main/cpp/CMakeLists.txt')
            version='4.1.2'
        }
    }
}

dependencies { compileOnly 'io.github.libxposed:api:102.0.0' }

dex2c { coverageRequirementsFile=file(rootProject.file('coverage-requirements.json')) }

if (providers.gradleProperty('dex2c.clang').isPresent()) {
    dex2c { clangExecutable=file(providers.gradleProperty('dex2c.clang').get()) }
}
if (providers.gradleProperty('dex2c.certificate').isPresent()) {
    dex2c { certificateFile=file(providers.gradleProperty('dex2c.certificate').get()) }
}
if (providers.gradleProperty('dex2c.pythonExecutable').isPresent()) {
    dex2c { pythonExecutable=file(providers.gradleProperty('dex2c.pythonExecutable').get()) }
}
if (providers.gradleProperty('dex2c.coverageRequirements').isPresent()) {
    dex2c { coverageRequirementsFile=file(providers.gradleProperty('dex2c.coverageRequirements').get()) }
}
