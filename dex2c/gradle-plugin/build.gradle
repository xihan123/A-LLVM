plugins { id 'java-gradle-plugin' }
dependencies {
    implementation project(':core')
    compileOnly 'com.android.tools.build:gradle-api:9.4.1'
    testImplementation 'com.android.tools.build:gradle-api:9.4.1'
}
gradlePlugin {
    plugins {
        dex2c {
            id = 'io.github.xihan123.dex2c'
            implementationClass = 'io.github.xihan123.dex2c.gradle.Dex2cPlugin'
            displayName = 'A-LLVM dex2c'
            description = 'Protect annotated Java/Kotlin methods with JNI and A-LLVM VMP.'
        }
        strings {
            id = 'io.github.xihan123.strings'
            implementationClass = 'io.github.xihan123.dex2c.gradle.StringsPlugin'
            displayName = 'A-LLVM string protection'
            description = 'Extract Java/Kotlin strings to authenticated A-LLVM native storage.'
        }
    }
}
