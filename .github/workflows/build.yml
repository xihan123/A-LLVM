name: build

on:
  workflow_call:
    inputs:
      ndk_tag: { type: string, required: true } # 上游 tag，如 r30-beta2
      our_tag: { type: string, required: true } # 本项目 tag，如 r30-30.0.15729638-beta2
      internal: { type: string, required: true } # 内部版本号 30.0.15729638
      channel: { type: string, required: true } # stable/beta/rc/canary
      host: { type: string, default: "linux-x86_64" }
      download_url: { type: string, required: true }
      patchset: { type: string, default: "" }
      mode: { type: string, default: "build" } # build=自建clang并混淆; repack=原样重打包
      targets: { type: string, default: "AArch64;ARM;X86" } # 四个主流 Android ABI 所需后端
      use_snapshot: { type: boolean, default: false } # 四组热构建验收前保持关闭
      snapshot_probe: { type: string, default: "none" } # 非发布性能验证：none / strings / vmp / multi
  workflow_dispatch:
    inputs:
      ndk_tag: { description: "上游 tag；与 internal 同时留空则自动取所选通道最新版", required: false, default: "" }
      our_tag: { description: "本项目 tag（留空则自动 <ndk_tag>-<internal>[-patchset]）", required: false, default: "" }
      internal: { description: "内部版本号；与 ndk_tag 同时留空则自动获取", required: false, default: "" }
      channel:
        description: "通道（自动获取版本时使用）"
        required: false
        type: choice
        options: [ "stable", "beta", "rc", "canary" ]
        default: "stable"
      host: { description: "host", required: false, default: "linux-x86_64" }
      download_url: { description: "官方 NDK 下载 URL（留空自动拼 linux.zip）", required: false, default: "" }
      patchset: { description: "patchset（留空则 tag 不含后缀）", required: false, default: "" }
      mode: { description: "build / repack", required: false, default: "build" }
      targets: { description: "LLVM_TARGETS_TO_BUILD（默认覆盖四个主流 Android ABI）", required: false, default: "AArch64;ARM;X86" }
      use_snapshot: { description: "复用 LLVM 构建快照（双 Host，验收前默认关闭）", type: boolean, default: false }
      snapshot_probe:
        description: "非发布热构建样本（仅追加注释，强制真实 Pass 重编）"
        type: choice
        options: ["none", "strings", "vmp", "multi"]
        default: "none"

permissions:
  contents: read

concurrency:
  group: ndk-${{ inputs.ndk_tag || 'latest' }}-${{ inputs.internal || 'auto' }}-${{ inputs.patchset }}-${{ inputs.host }}
  cancel-in-progress: false

jobs:
  build:
    # linux host 在 ubuntu 上编，windows host（windows-x86_64）在 windows runner 上原生编。
    runs-on: ${{ inputs.host == 'windows-x86_64' && 'windows-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash # windows runner 用 Git Bash 跑同一套 POSIX 步骤
    env:
      NDK_TAG: ${{ inputs.ndk_tag }}
      HOST: ${{ inputs.host }}
      MODE: ${{ inputs.mode }}
      INTERNAL: ${{ inputs.internal }}
      CHANNEL: ${{ inputs.channel }}
      PATCHSET_VERSION: ${{ inputs.patchset }}
      DOWNLOAD_URL: ${{ inputs.download_url }}
      LLVM_TARGETS: ${{ inputs.targets }}
      USE_SNAPSHOT: ${{ inputs.use_snapshot && 'true' || 'false' }}
      SNAPSHOT_PROBE: ${{ inputs.snapshot_probe || 'none' }}
    steps:
    - uses: actions/checkout@v7

    - name: 自动获取所选通道的最新 NDK
      if: ${{ inputs.ndk_tag == '' && inputs.internal == '' }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python scripts/discover_ndk.py --latest-channel "$CHANNEL"

    - name: 计算 our_tag / download_url 默认值
      id: vars
      run: |
        set -euo pipefail
        [ -n "$NDK_TAG" ] && [ -n "$INTERNAL" ] || {
          echo "::error::ndk_tag 与 internal 必须同时填写，或同时留空自动获取最新版"; exit 1;
        }
        OUR_TAG="${{ inputs.our_tag }}"
        if [ -z "$OUR_TAG" ]; then
          BASE="${NDK_TAG%%-*}"
          SUFFIX="${NDK_TAG#"$BASE"}"
          SUFFIX="${SUFFIX#-}"
          OUR_TAG="${BASE}-${INTERNAL}${SUFFIX:+-$SUFFIX}${PATCHSET_VERSION:+-$PATCHSET_VERSION}"
        fi
        URL="${DOWNLOAD_URL}"
        if [ -z "$URL" ]; then
          case "$HOST" in
            windows-x86_64) HOSTFILE=windows.zip ;;
            *)              HOSTFILE=linux.zip ;;
          esac
          URL="https://dl.google.com/android/repository/android-ndk-${NDK_TAG}-${HOSTFILE}"
        fi
        echo "our_tag=$OUR_TAG" >> "$GITHUB_OUTPUT"
        echo "download_url=$URL" >> "$GITHUB_OUTPUT"
        echo "OUR_TAG=$OUR_TAG" >> "$GITHUB_ENV"

    - name: 校验 host
      run: |
        case "$MODE" in
          build|repack) ;;
          *) echo "::error::不支持的 mode=$MODE（仅 build / repack）"; exit 1 ;;
        esac
        case "$SNAPSHOT_PROBE" in
          none) ;;
          strings|vmp|multi)
            [ "$MODE" = build ] && [ "$USE_SNAPSHOT" = true ] || {
              echo "::error::性能样本需要 build 模式和 use_snapshot=true"; exit 1;
            } ;;
          *) echo "::error::未知性能样本"; exit 1 ;;
        esac
        if [ "$MODE" = build ]; then
          for target in AArch64 ARM X86; do
            case ";$LLVM_TARGETS;" in
              *";$target;"*) ;;
              *) echo "::error::targets 缺少四 ABI 测试所需后端：$target"; exit 1 ;;
            esac
          done
        fi
        case "$HOST" in
          linux-x86_64|windows-x86_64) echo "host=$HOST 受支持" ;;
          *) echo "::error::不支持的 host=$HOST（仅 linux-x86_64 / windows-x86_64；macOS 属后续阶段）"; exit 1 ;;
        esac

    - name: 检查构建盘容量
      if: ${{ inputs.mode == 'build' && runner.os == 'Linux' }}
      id: disk
      run: |
        python - <<'PY'
        import os, shutil
        free = shutil.disk_usage('.').free
        print(f'Available: {free / 2**30:.1f} GiB')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'cleanup={str(free < 20 * 2**30).lower()}\n')
        PY

    - name: 清理磁盘空间
      if: ${{ steps.disk.outputs.cleanup == 'true' }}
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true
        large-packages: false

    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: 下载官方 NDK
      run: |
        python scripts/build_snapshot.py run --phase ndk-download -- \
          curl -fL --retry 3 -o ndk.zip "${{ steps.vars.outputs.download_url }}"
        echo "下载 sha256: $(sha256sum ndk.zip | cut -d' ' -f1)"

    - name: 解压官方 NDK
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          python scripts/build_snapshot.py run --phase ndk-unpack -- 7z x -y ndk.zip
        else
          python scripts/build_snapshot.py run --phase ndk-unpack -- unzip -q ndk.zip
        fi
        NDK_DIR="$(find . -maxdepth 1 -type d -name 'android-ndk-*' | head -n1)"
        [ -n "$NDK_DIR" ] || { echo "::error::未找到解压后的 NDK 目录"; exit 1; }
        NDK_DIR="$(cd "$NDK_DIR" && pwd -P)"
        echo "NDK_DIR=$NDK_DIR" >> "$GITHUB_ENV"
        echo "解压得到：$NDK_DIR"

    # ---------------- build 模式：自建 patched clang ----------------
    - name: 安装宿主构建工具链（Linux）
      if: ${{ inputs.mode == 'build' && runner.os == 'Linux' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang lld ninja-build cmake python3 zlib1g-dev

    - name: 配置 MSVC 环境（Windows）
      if: ${{ inputs.mode == 'build' && runner.os == 'Windows' }}
      uses: ilammy/msvc-dev-cmd@v1

    - name: 安装 ninja（Windows）
      if: ${{ inputs.mode == 'build' && runner.os == 'Windows' }}
      uses: seanmiddleditch/gha-setup-ninja@v6

    - name: 使用 GNU tar 保留快照时间戳（Windows）
      if: ${{ inputs.mode == 'build' && runner.os == 'Windows' }}
      run: |
        # actions/cache 优先使用 Git 自带 GNU tar；不要把 usr/bin 放在 MSVC link.exe 前面。
        echo "SNAPSHOT_TAR=$(cygpath -w /usr/bin/tar.exe)" >> "$GITHUB_ENV"
        /usr/bin/tar --version

    - name: 解析官方编译器的上游 LLVM 基线
      if: ${{ inputs.mode == 'build' }}
      id: loc
      run: |
        python scripts/locate_llvm.py --ndk-dir "$NDK_DIR" --host "$HOST"

    - name: 准备热构建性能样本
      if: ${{ inputs.mode == 'build' && inputs.snapshot_probe != '' && inputs.snapshot_probe != 'none' }}
      env:
        LLVM_MAJOR: ${{ steps.loc.outputs.llvm_major }}
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        files = {'strings': ['StringEncryption.cpp'], 'vmp': ['aVMP/aVMP.cpp'],
                 'multi': ['StringEncryption.cpp', 'aVMP/aVMP.cpp', 'SelfCheck.cpp', 'Utils.cpp']}
        root = Path('obfuscation') / ('llvm-' + os.environ['LLVM_MAJOR']) / 'Transforms/Obfuscation'
        for name in files[os.environ['SNAPSHOT_PROBE']]:
            with (root / name).open('a', encoding='utf-8', newline='\n') as stream:
                stream.write('\n// Snapshot performance probe: ' + os.environ['GITHUB_RUN_ID'] + '\n')
        PY

    - name: 计算构建配置与快照精确键
      if: ${{ inputs.mode == 'build' }}
      id: snapshot_key
      run: |
        SNAPSHOT_ARGS=()
        if [ "$USE_SNAPSHOT" = true ]; then SNAPSHOT_ARGS+=(--enabled); fi
        python scripts/build_snapshot.py prepare \
          --base "${{ steps.loc.outputs.base_commit }}" \
          --major "${{ steps.loc.outputs.llvm_major }}" --host "$HOST" --targets "$LLVM_TARGETS" "${SNAPSHOT_ARGS[@]}"

    - name: 恢复 LLVM 构建快照
      if: ${{ inputs.mode == 'build' && inputs.use_snapshot }}
      id: restore_snapshot
      continue-on-error: true
      uses: actions/cache/restore@v5
      with:
        key: ${{ steps.snapshot_key.outputs.key }}
        path: |
          llvm-project
          build
          .llvm-build-snapshot.json

    - name: 校验快照，不兼容或不完整时清理并冷构建
      if: ${{ inputs.mode == 'build' && inputs.use_snapshot }}
      id: snapshot
      run: python scripts/build_snapshot.py validate --cache-hit "${{ steps.restore_snapshot.outputs.cache-hit }}"

    - name: 浅克隆 llvm-project @ base commit
      if: ${{ inputs.mode == 'build' && steps.snapshot.outputs.hit != 'true' }}
      run: |
        python scripts/build_snapshot.py run --phase clone -- "$BASH" -euo pipefail <<'BUILD_STEP'
        set -euo pipefail
        BASE="${{ steps.loc.outputs.base_commit }}"
        [ -n "$BASE" ] || { echo "::error::base_commit 为空"; exit 1; }
        git init -q llvm-project
        cd llvm-project
        git remote add origin https://github.com/llvm/llvm-project.git
        git fetch -q --depth=1 origin "$BASE"
        git reset -q --hard FETCH_HEAD
        echo "llvm-project @ $BASE"
        BUILD_STEP

    - name: 应用混淆 overlay（build 模式必须存在）
      if: ${{ inputs.mode == 'build' }}
      id: overlay
      run: |
        python scripts/build_snapshot.py run --phase overlay -- "$BASH" -euo pipefail <<'BUILD_STEP'
        set -euo pipefail
        MAJOR="${{ steps.loc.outputs.llvm_major }}"
        [ -d "obfuscation/llvm-$MAJOR/Transforms/Obfuscation" ] || {
          echo "::error::缺少 LLVM $MAJOR 混淆 overlay；build 模式拒绝发布无混淆工具链"; exit 1;
        }
        [ -f "obfuscation/llvm-$MAJOR/registration.patch" ] || {
          echo "::error::LLVM $MAJOR overlay 缺少 registration.patch"; exit 1;
        }
        bash scripts/apply_overlay.sh --llvm-src "$PWD/llvm-project" --major "$MAJOR"
        echo "overlay_applied=true" >> "$GITHUB_OUTPUT"
        BUILD_STEP

    - name: 配置并编译 clang
      if: ${{ inputs.mode == 'build' }}
      run: |
        set -euo pipefail
        if [ "${{ steps.snapshot.outputs.hit }}" != true ]; then
          python scripts/build_snapshot.py configure
        fi
        python scripts/build_snapshot.py run --phase compile -- ninja -C build clang clang-resource-headers

    - name: 用自建二进制覆盖 NDK
      if: ${{ inputs.mode == 'build' }}
      run: |
        python scripts/build_snapshot.py run --phase assemble -- "$BASH" -euo pipefail <<'BUILD_STEP'
        bash scripts/overlay_ndk.sh --built "$PWD/build" --ndk "$NDK_DIR" \
          --host "$HOST" --major "${{ steps.loc.outputs.llvm_major }}"

        BUILD_STEP

    # ---------------- 公共：元数据 / 测试 / 打包 ----------------
    - name: 写入可追溯元数据
      run: |
        python scripts/make_release_meta.py --ndk-dir "$NDK_DIR" \
          --our-tag "$OUR_TAG" --ndk-tag "$NDK_TAG" --internal "$INTERNAL" \
          --channel "$CHANNEL" --host "$HOST" --patchset "$PATCHSET_VERSION" \
          --llvm-major "${{ steps.loc.outputs.llvm_major }}" \
          --clang-rev "${{ steps.loc.outputs.clang_rev }}" \
          --base-commit "${{ steps.loc.outputs.base_commit }}" \
          --overlay-applied "${{ steps.overlay.outputs.overlay_applied || 'false' }}" \
          --snapshot-state .snapshot/state.json \
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    - name: 宿主运行语义回归（build 模式）
      if: ${{ inputs.mode == 'build' }}
      run: |
        python scripts/build_snapshot.py run --phase host-tests -- "$BASH" -euo pipefail <<'BUILD_STEP'
        set -euo pipefail
        case "$HOST" in
          windows-x86_64) CLANG="$PWD/build/bin/clang.exe"; TARGET=x86_64-pc-windows-msvc ;;
          linux-x86_64) CLANG="$PWD/build/bin/clang"; TARGET=x86_64-unknown-linux-gnu ;;
        esac
        bash tests/string-enc/roundtrip.sh "$CLANG" --target="$TARGET"
        bash tests/string-enc/lifetime.sh "$CLANG" --target="$TARGET"
        bash tests/constant-enc/roundtrip.sh "$CLANG" --target="$TARGET"
        bash tests/cert-bind/roundtrip.sh "$CLANG" --target="$TARGET"
        BUILD_STEP

    - name: 包结构测试
      run: python scripts/build_snapshot.py run --phase test-layout -- "$BASH" tests/package-layout/check_layout.sh "$NDK_DIR" "$HOST"

    - name: 四 ABI 编链冒烟
      if: ${{ inputs.mode == 'build' }}
      run: python scripts/build_snapshot.py run --phase test-abi -- "$BASH" tests/abi-smoke/run.sh "$NDK_DIR" "$HOST"

    - name: CMake / ndk-build 冒烟
      if: ${{ inputs.mode == 'build' }}
      run: python scripts/build_snapshot.py run --phase test-build-system -- "$BASH" tests/build-system-smoke/run.sh "$NDK_DIR" "$HOST"

    - name: 字符串加密测试（build 模式）
      if: ${{ inputs.mode == 'build' }}
      run: python scripts/build_snapshot.py run --phase test-strings -- "$BASH" tests/string-enc/check.sh "$NDK_DIR" "$HOST"

    - name: 去指纹测试（build 模式）
      if: ${{ inputs.mode == 'build' }}
      run: python scripts/build_snapshot.py run --phase test-fingerprint -- "$BASH" tests/fingerprint-scrub/run.sh "$NDK_DIR" "$HOST"

    - name: 代码完整性自校验测试（build 模式）
      if: ${{ inputs.mode == 'build' }}
      run: python scripts/build_snapshot.py run --phase test-self-check -- "$BASH" tests/anti-tamper/run.sh "$NDK_DIR" "$HOST"

    - name: 证书绑定测试（build 模式）
      if: ${{ inputs.mode == 'build' }}
      run: python scripts/build_snapshot.py run --phase test-certificate -- "$BASH" tests/cert-bind/run.sh "$NDK_DIR" "$HOST"

    - name: VMP 并发语义样本编链（build 模式）
      if: ${{ inputs.mode == 'build' }}
      run: python scripts/build_snapshot.py run --phase test-vmp-compile -- "$BASH" tests/vmp/roundtrip.sh "$NDK_DIR" "$HOST"

    - name: 打包
      run: |
        python scripts/build_snapshot.py run --phase package -- "$BASH" -euo pipefail <<'BUILD_STEP'
        set -euo pipefail
        mkdir -p dist
        ZIP="android-ndk-${OUR_TAG}-${HOST}.zip"
        if [ "$RUNNER_OS" = "Windows" ]; then
          7z a -tzip -mx=1 "dist/$ZIP" "$(basename "$NDK_DIR")" >/dev/null
        else
          zip -1 -r -q "dist/$ZIP" "$(basename "$NDK_DIR")"
        fi
        ( cd dist && sha256sum *.zip > SHA256SUMS )
        ls -lh dist/
        BUILD_STEP

    - name: 验证打包后 NDK
      if: ${{ inputs.mode == 'build' }}
      run: |
        python scripts/build_snapshot.py run --phase package-verify -- "$BASH" -euo pipefail <<'BUILD_STEP'
        CHECK_DIR="$(mktemp -d)"
        trap 'rm -rf "$CHECK_DIR"' EXIT
        ZIP="dist/android-ndk-${OUR_TAG}-${HOST}.zip"
        if [ "$RUNNER_OS" = Windows ]; then
          7z x -y "$ZIP" "-o$CHECK_DIR" >/dev/null
        else
          unzip -q "$ZIP" -d "$CHECK_DIR"
        fi
        PACKED_NDK="$CHECK_DIR/$(basename "$NDK_DIR")"
        bash tests/package-layout/check_layout.sh "$PACKED_NDK" "$HOST"
        bash tests/abi-smoke/run.sh "$PACKED_NDK" "$HOST"
        bash tests/build-system-smoke/run.sh "$PACKED_NDK" "$HOST"
        BUILD_STEP

    - uses: actions/upload-artifact@v7
      with:
        name: ndk-${{ steps.vars.outputs.our_tag }}-${{ inputs.host }}
        path: dist/*.zip
        retention-days: 7
        compression-level: 0

    # Immutable snapshots are written only after all existing tests and artifact upload succeed.
    - name: 生成完整快照清单
      if: >-
        ${{ inputs.mode == 'build' && inputs.use_snapshot && env.SNAPSHOT_PROBE == 'none' &&
            steps.restore_snapshot.outputs.cache-hit != 'true' &&
            github.event_name != 'pull_request' && github.event_name != 'pull_request_target' &&
            (github.ref == 'refs/heads/dev' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
      id: seal_snapshot
      run: python scripts/build_snapshot.py seal

    - name: 保存已通过回归的 LLVM 构建快照
      if: ${{ steps.seal_snapshot.outcome == 'success' }}
      id: save_snapshot
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.snapshot_key.outputs.key }}
        path: |
          llvm-project
          build
          .llvm-build-snapshot.json

    - name: 汇总构建耗时
      if: always()
      run: python scripts/build_snapshot.py report --save-outcome "${{ steps.save_snapshot.outcome }}"

    - name: 上传构建耗时与快照信息
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-metrics-${{ steps.vars.outputs.our_tag }}-${{ inputs.host }}
        path: .snapshot/*.json
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: ignore
