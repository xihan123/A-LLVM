name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dex2c:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Annotation, bytecode selection and plugin validation
        shell: pwsh
        run: ./dex2c/gradlew.bat -p dex2c check :gradle-plugin:validatePlugins --console=plain

  windows-snapshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Windows snapshot and GNU tar roundtrip tests
        shell: bash
        run: |
          export SNAPSHOT_TAR="$(cygpath -w /usr/bin/tar.exe)"
          python -m unittest discover -s tests/build-snapshot -p 'test_*.py' -v

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python -m py_compile scripts/*.py tests/discover/test_discover.py tests/locate-llvm/test_locate_llvm.py tests/overlay/test_*.py tests/cert-bind/device_roundtrip.py
      - name: Discovery tests
        run: python tests/discover/test_discover.py
      - name: LLVM location tests
        run: python tests/locate-llvm/test_locate_llvm.py
      - name: dex2c release script tests
        run: python -m unittest discover -s tests/dex2c -p 'test_*.py' -v
      - name: Native APK certificate ownership tests
        run: python tests/cert-bind/test_apkcert.py
      - name: Hardened CSE crypto and sealer tests
        run: |
          python tests/cse-hardened/test_seal_cse.py
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Iruntime tests/cse-hardened/crypto_test.cpp -o /tmp/ndkp-cse-crypto
          /tmp/ndkp-cse-crypto
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Iruntime tests/cse-hardened/io_test.cpp -o /tmp/ndkp-cse-io
          /tmp/ndkp-cse-io
      - name: Overlay sync and patch tests
        run: python -m unittest discover -s tests/overlay -p 'test_*.py' -v
      - name: VMP bitcode generator tests
        run: python tests/vmp/test_gen_vm_bitcode.py
      - name: Build snapshot tests
        run: python -m unittest discover -s tests/build-snapshot -p 'test_*.py' -v
      - name: Build-system smoke runner tests
        run: bash tests/build-system-smoke/test_run.sh
      - name: Shell syntax
        run: |
          for file in scripts/*.sh tests/*/*.sh; do
            bash -n "$file" || exit 1
          done
